{% extends "base.html" %}
{% block content %}
<h1>🏆 Live Scoreboard</h1>
<table>
<tr><th>#</th><th>Team</th><th>Score</th><th>Solves</th></tr>
{% for r in rows %}
<tr><td>{{ loop.index }}</td><td>{{ r.name }}</td><td>{{ r.score }}</td><td>{{ r.solves }}</td></tr>
{% endfor %}
</table>
<script>setTimeout(()=>location.reload(), 15000);</script>
{% endblock %}
